opensearch-operator:
  webhook:
    certManager:
      # Renders the Issuer, Certificate and the webhook's cert-manager.io/inject-ca-from
      # annotation. Requires cert-manager to already be running: it is deployed by a
      # separate ArgoCD Application (../cert-manager.yaml) synced before this one.
      enabled: true

  manager:
    # Log level of the operator. Possible values: debug, info, warn, error
    loglevel: info

    # If specified, the operator will be restricted to watch objects only in the desired namespace. Defaults is to watch all namespaces.
    watchNamespace: opensearch
