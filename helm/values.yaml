cert-manager:
  installCRDs: true

opensearch-operator:
  webhook:
    certManager:
      # Disabled: Certificate/Issuer managed in helm/templates/ with ArgoCD sync-waves
      enabled: false

manager:
  # Log level of the operator. Possible values: debug, info, warn, error
  loglevel: info

  # If specified, the operator will be restricted to watch objects only in the desired namespace. Defaults is to watch all namespaces.
  watchNamespace: opensearch